name = "site-sentinel-bot"
main = "src/index.js"
compatibility_date = "2024-12-01"
workers_dev = true

# ─── Scheduled Monitoring Trigger ─────────────────────────────
# Cloudflare Workers Free tier has an account-wide limit of 5 cron triggers across all workers.
# If your account has free cron slots, uncomment the block below:
# [triggers]
# crons = ["*/5 * * * *"]
#
# Otherwise, trigger checks via an external pinger (cron-job.org) hitting:
# https://site-sentinel-bot.saini-gaurav2907.workers.dev/trigger-cron?token=<ADMIN_TOKEN>



# ─── KV Namespace Binding ───────────────────────────────────
[[kv_namespaces]]
binding = "SITE_SENTINEL_STORE"
id = "4f5f23b2ee8249bda5951ffb8e037b84"

# ─── Smart Placement ────────────────────────────────────────
[placement]
mode = "smart"

# ─── Environment Variables (Non-secret) ─────────────────────
[vars]
TIMEZONE = "Asia/Kolkata"
DEFAULT_TIMEOUT_MS = "10000"
CHECK_INTERVAL_MINS = "15"
ALERT_REPEAT_INTERVAL_HOURS = "0"
NOTIFY_ON_STATUS_CHANGE_ONLY = "true"
MAX_RETRIES = "2"
DEFAULT_USER_AGENT = "SiteSentinel/1.0 (UptimeMonitor; +https://t.me/SiteSentinalBot)"
